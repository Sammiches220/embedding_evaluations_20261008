[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-representation-audit"
version = "1.0.0"
description = "Audit how well source-population features are represented in embeddings and how extrinsic predictions distort apparent structure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyarrow>=14",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
test = ["pytest>=7", "ripser>=0.6"]

[project.scripts]
parquet-representation-audit = "parquet_audit.cli:main"
embedding-dataframe-audit = "embedding_feature_audit.dataframe_cli:main"
embedding-feature-audit = "embedding_feature_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["embedding_feature_audit*", "parquet_audit*"]

[tool.setuptools.package-data]
embedding_feature_audit = ["assets/*.js", "assets/*.css"]
parquet_audit = ["schemas/*.json"]
