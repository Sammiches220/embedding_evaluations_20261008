[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-representation-audit"
version = "1.0.0"
description = "Human-readable audits of embedding organization for explicit Parquet features"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=14",
  "jsonschema>=4.19",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1,<4"]

[project.scripts]
parquet-audit = "parquet_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["embedding_feature_audit", "parquet_audit"]
include-package-data = true

[tool.setuptools.package-data]
parquet_audit = ["schemas/*.schema.json", "templates/*.json"]
embedding_feature_audit = ["assets/*"]
